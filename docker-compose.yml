services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Sin definir ⇒ demo local (localhost:3004). En el host del túnel,
        # poner NEXT_PUBLIC_API_WS_URL= (vacía) en .env ⇒ mismo origen.
        NEXT_PUBLIC_API_WS_URL: ${NEXT_PUBLIC_API_WS_URL-http://localhost:3004}
    # 3002 en el host: slot de core-dashboard (web) en la plantilla de puertos del portfolio
    # (el túnel de Cloudflare apunta a 3002 → dash.corecodeinnovation.com).
    ports: ["3002:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # 3004 en el host: slot de core-dashboard (api/WS). Solo para dev; el web habla
    # con la api por la red de compose.
    ports: ["3004:3000"]
    environment:
      # Dentro de la red de compose se usan los defaults (db:5432, redis:6379).
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${POSTGRES_DB:-dashboard}
      REDIS_URL: redis://redis:6379
      PROMETHEUS_URL: http://prometheus:9090
      DOCKER_SOCKET: /var/run/docker.sock
      COMPOSE_PROJECTS: ${COMPOSE_PROJECTS:-}
      PROTECTED_PROJECTS: ${PROTECTED_PROJECTS:-core-dashboard,cci-auth-service}
      # Validación de JWT: JWKS de cci-auth-service (RS256) + iss verificado.
      # Alcanzable por nombre solo porque `api` está en la red compartida cci-net (abajo).
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://cci-auth-service:3000}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://cci-auth-service:3000/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.corecodeinnovation.com}
      # Solo dev/tests: dejar vacío en producción, nunca hardcodear un secreto acá.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002}
      # Alertas (RF-06): sin estas dos, NotifyBotClient loguea un warn y no manda nada.
      NOTIFY_BOT_URL: ${NOTIFY_BOT_URL:-http://ops-notify-bot:3001}
      NOTIFY_BOT_WEBHOOK_SECRET: ${NOTIFY_BOT_WEBHOOK_SECRET:-}
      # Jobs pesados (RF-08): taskforge NO tiene alias en cci-net, es taskforge-api-1.
      TASKFORGE_URL: ${TASKFORGE_URL:-http://taskforge-api-1:3000}
      TASKFORGE_CLIENT_ID: ${TASKFORGE_CLIENT_ID:-}
      TASKFORGE_CLIENT_SECRET: ${TASKFORGE_CLIENT_SECRET:-}
    volumes:
      # Solo lectura: estado/eventos/logs de contenedores. Nunca escritura directa.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # El socket es root:root 660 dentro del contenedor y el proceso corre como
    # node (1000): se agrega el grupo dueño del socket para poder conectarse.
    # gid 0 en Docker Desktop; en un host Linux poner el gid del grupo docker.
    group_add: ["${DOCKER_GROUP_GID:-0}"]
    # Red compartida del portfolio (ya la usan cci-auth-service y ops-notify-bot):
    # sin esto, AUTH_SERVICE_URL/NOTIFY_BOT_URL no resuelven aunque estén bien
    # configuradas. `default` mantiene la comunicación con db/redis/prometheus.
    networks:
      default: {}
      cci-net: {}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    # 5435 en el host: slot de core-dashboard; para correr migraciones desde el host.
    ports: ["5435:5432"]
    volumes: ["dashdb:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 6382 en el host: slot de core-dashboard; para dev desde el host.
    ports: ["6382:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prometheus y cAdvisor solo viven en la red interna de compose: sin puertos
  # publicados; la api actúa de proxy de consultas (PROMETHEUS_URL).
  prometheus:
    image: prom/prometheus:v2.53.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # El socket va aparte y rw: connect() sobre un unix socket necesita escritura;
      # sin él cAdvisor no resuelve nombres de contenedor (labels name/image vacíos).
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  dashdb: {}
  prometheus-data: {}

networks:
  # Ya existe en el host (creada al levantar cci-auth-service/ops-notify-bot):
  # docker network create cci-net
  cci-net:
    external: true
