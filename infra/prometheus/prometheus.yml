# Prometheus interno del compose: scrapea cAdvisor para métricas por contenedor.
# Retención (30 d) definida por flag en docker-compose.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Los labels de compose traen hashes y rutas absolutas del host; se descartan.
      # Para identificar contenedores alcanzan name/image + service/project de compose.
      - regex: "container_label_com_docker_compose_(config_hash|image|oneoff|container_number|depends_on|project_config_files|project_working_dir|version)"
        action: labeldrop
